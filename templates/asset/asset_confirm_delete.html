{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Asset · PixelShelf</title>
    <link rel="stylesheet" href="{% static 'css/asset/asset.css' %}">
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="{% url 'home:home' %}">🎮 PixelShelf</a>
        <div class="nav-links">
            <a href="{% url 'home:home' %}">Home</a>
            <a href="{% url 'asset:list' %}" class="active">Assets</a>
            <a href="{% url 'shelf:list' %}">Shelves</a>
            <a href="{% url 'profile:profile' %}">Profile</a>
            <a href="{% url 'user_settings:settings' %}">Settings</a>
            <a href="{% url 'login:logout' %}">Logout</a>
        </div>
    </nav>

    <main class="content narrow">
        <div class="form-card confirm-card">
            <h1>Delete "{{ asset.title }}"?</h1>
            <p>This removes the asset, its file, and its tag/shelf associations. This can't be undone.</p>

            <img class="confirm-thumb" src="{{ asset.file_path.url }}" alt="{{ asset.title }}">

            <form method="post">
                {% csrf_token %}
                <div class="confirm-actions">
                    <a href="{% url 'asset:detail' asset.pk %}" class="secondary-btn-inline">Cancel</a>
                    <button type="submit" class="danger-btn">Delete Asset</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
