{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'css/register/register.css' %}">
</head>
<body>
    <div class="auth-card">
        <h1>Create an account</h1>
        <p class="subtitle">It only takes a minute</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" id="register-form">
            {% csrf_token %}
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Username" value="{{ username|default:'' }}" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required minlength="8">

            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required minlength="8">
            <p class="field-error" id="match-error" hidden>Passwords do not match.</p>

            <button type="submit" class="primary-btn">Register</button>
        </form>

        <a class="link" href="{% url 'login:login' %}">Back to Login</a>
    </div>

    <script src="{% static 'js/register/register.js' %}"></script>
</body>
</html>
