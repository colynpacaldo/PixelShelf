{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="{% static 'css/common/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/user_settings/settings.css' %}">
</head>
<body class="{% if site_dark_mode %}dark-mode{% endif %}">
    <nav class="topbar">
        <a class="brand" href="{% url 'home:home' %}">PixelShelf</a>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
        <div class="nav-links" id="nav-links">
            <a href="{% url 'home:home' %}">Home</a>
            <a href="{% url 'asset:list' %}">Assets</a>
            <a href="{% url 'shelf:list' %}">Shelves</a>
            <a href="{% url 'profile:profile' %}">Profile</a>
            <a href="{% url 'user_settings:settings' %}">Settings</a>
            <a href="{% url 'login:logout' %}">Logout</a>
        </div>
    </nav>

    <main class="content">
        <h1>Settings</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="info">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <div class="settings-card">
            <form method="post">
                {% csrf_token %}

                <label class="toggle-row">
                    {{ form.dark_mode }}
                    <span>Dark mode</span>
                </label>

                <label class="toggle-row">
                    {{ form.email_notifications }}
                    <span>Email notifications</span>
                </label>

                <button type="submit" class="primary-btn">Save Settings</button>
            </form>
        </div>
    </main>
    <script src="{% static 'js/common/nav.js' %}"></script>
</body>
</html>
